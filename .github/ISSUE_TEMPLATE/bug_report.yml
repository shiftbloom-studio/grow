name: Bug report
description: Something in grow doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the dashboard\n2. ...\n3. ..."
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Hosted (grow.shiftbloom.studio)
        - Self-hosted
        - Local development
  - type: input
    id: env
    attributes:
      label: Browser / OBS version
      placeholder: "e.g. OBS 31.0, Chrome 131"
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors, the chat command you used. Please don't paste dashboard keys or overlay links.
