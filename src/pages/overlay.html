<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>grow overlay</title>
<link rel="stylesheet" href="/fonts.css">
<style>
  :root { --accent:#7cf29c; --fs:18px; --w:420px; --mh:640px; --bg:rgba(14,16,24,.72); --fg:#f4f6fb; --muted:rgba(244,246,251,.55); --border:rgba(255,255,255,.12); --radius:18px; --font:"Inter","Segoe UI",system-ui,sans-serif; }
  html,body { margin:0; background:transparent; font-family:var(--font); color:var(--fg); overflow:hidden; }
  body.preview { background:repeating-conic-gradient(#2a2d36 0 25%, #1f2129 0 50%) 0 0/32px 32px; min-height:100vh; padding:24px; box-sizing:border-box; }
  .card { width:var(--w); max-width:100%; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 10px 40px rgba(0,0,0,.35); font-size:var(--fs); overflow:hidden; }
  .head { display:flex; align-items:center; gap:.6em; padding:.75em 1em .6em; border-bottom:1px solid var(--border); }
  .title { font-weight:700; letter-spacing:.01em; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .count { font-variant-numeric:tabular-nums; font-weight:600; color:var(--accent); font-size:.85em; }
  .bar { height:3px; background:rgba(255,255,255,.08); }
  .bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .6s cubic-bezier(.2,.8,.2,1); box-shadow:0 0 12px var(--accent); }
  .viewport { max-height:var(--mh); overflow:hidden; position:relative; }
  .viewport.fade { -webkit-mask-image:linear-gradient(transparent, #000 1.2em, #000 calc(100% - 1.2em), transparent); mask-image:linear-gradient(transparent, #000 1.2em, #000 calc(100% - 1.2em), transparent); }
  .scroller.anim { animation:scroll var(--dur,20s) linear infinite; }
  @keyframes scroll { from { transform:translateY(0) } to { transform:translateY(calc(-1 * var(--h))) } }
  .list { padding:.5em .9em .7em; }
  .group { margin:.35em 0 .55em; border-radius:12px; transition:background .4s; }
  .group.flash { background:rgba(255,255,255,.12); }
  .who { font-weight:700; font-size:.8em; letter-spacing:.03em; margin:0 0 .2em .1em; }
  .task { display:flex; gap:.6em; align-items:flex-start; padding:.22em .1em; line-height:1.3; animation:pop .45s cubic-bezier(.2,.9,.3,1.3); }
  .box { flex:none; width:1em; height:1em; margin-top:.15em; border-radius:.3em; border:2px solid var(--muted); box-sizing:border-box; display:grid; place-items:center; transition:all .3s; }
  .task.done .box { background:var(--accent); border-color:var(--accent); }
  .task.done .box::after { content:""; width:.28em; height:.5em; border:solid #0b0d12; border-width:0 .14em .14em 0; transform:rotate(45deg) translate(-.03em,-.06em); }
  .task.done .txt { color:var(--muted); text-decoration:line-through; text-decoration-color:var(--accent); }
  .txt { overflow-wrap:anywhere; }
  .inline-who { font-weight:700; margin-right:.35em; }
  .empty { padding:1.1em 1em; color:var(--muted); font-size:.85em; }
  .empty code { color:var(--accent); }
  @keyframes pop { from { opacity:0; transform:translateY(.4em) scale(.98) } to { opacity:1; transform:none } }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(140%); background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:.55em 1.1em; font-size:var(--fs); box-shadow:0 10px 40px rgba(0,0,0,.35); backdrop-filter:blur(14px); opacity:0; transition:transform .45s cubic-bezier(.2,.9,.3,1.2), opacity .3s; white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis; }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  .toast b { color:var(--accent); }
  .toast.warn { border-color:rgba(255,93,108,.6); }
  .status { position:fixed; top:6px; right:8px; width:8px; height:8px; border-radius:50%; background:#ff5d6c; opacity:0; transition:opacity .3s; }
  .status.off { opacity:1; }
  /* themes */
  body.theme-minimal { --bg:transparent; --border:transparent; }
  body.theme-minimal .card { box-shadow:none; backdrop-filter:none; text-shadow:0 2px 6px rgba(0,0,0,.8), 0 0 2px rgba(0,0,0,.9); }
  body.theme-minimal .head { border-bottom-color:rgba(255,255,255,.25); }
  body.theme-neon { --bg:rgba(8,6,20,.82); --border:var(--accent); }
  body.theme-neon .card { box-shadow:0 0 18px color-mix(in srgb, var(--accent) 55%, transparent), inset 0 0 18px color-mix(in srgb, var(--accent) 20%, transparent); }
  body.theme-neon .title { text-shadow:0 0 8px var(--accent); }
  body.theme-paper { --bg:#fbf7ef; --fg:#2a2620; --muted:rgba(42,38,32,.5); --border:rgba(42,38,32,.12); --font:"Nunito","Segoe UI",system-ui,sans-serif; }
  body.theme-paper .task.done .box::after { border-color:#fbf7ef; }
  body.theme-bloom { --bg:#FFFFFF; --fg:#1A1216; --muted:rgba(26,18,22,.45); --border:#1A1216; --accent:#FF2E52 !important; --radius:22px; --font:"General Sans","Segoe UI",system-ui,sans-serif; }
  body.theme-bloom .card { border-width:1.5px; box-shadow:none; backdrop-filter:none; }
  body.theme-bloom .head { border-bottom:1.5px solid #1A1216; }
  body.theme-bloom .title { font-family:"Clash Display","General Sans",sans-serif; font-weight:600; letter-spacing:-.02em; }
  body.theme-bloom .count { font-family:"JetBrains Mono",ui-monospace,monospace; color:#C81040; }
  body.theme-bloom .bar > i { box-shadow:none; }
  body.theme-bloom .who { color:rgba(26,18,22,.6) !important; font-family:"JetBrains Mono",ui-monospace,monospace; font-weight:500; font-size:.66em; letter-spacing:.14em; text-transform:uppercase; }
  body.theme-bloom .box { border-radius:50%; border-width:1.5px; }
  body.theme-bloom .task.done .box { box-shadow:inset 0 0 0 .2em #fff; }
  body.theme-bloom .task.done .box::after { display:none; }
  /* brandbook: things unfold, they never slide */
  @keyframes unfold { from { opacity:0; transform:scale(.96) } to { opacity:1; transform:none } }
  body.theme-bloom .task { animation:unfold .45s cubic-bezier(.22,1.1,.36,1); transform-origin:left center; }
  body.theme-bloom .toast { background:#1A1216; color:#fff; border-color:#1A1216; transform:translateX(-50%) scale(.96); opacity:0; transition:transform .45s cubic-bezier(.22,1.1,.36,1), opacity .3s cubic-bezier(.4,0,.2,1); }
  body.theme-bloom .toast.show { transform:translateX(-50%) scale(1); opacity:1; }
  body.theme-bloom .toast.warn { background:#fff; color:#1A1216; border:1.5px solid #C81040; }
  body.theme-bloom .toast b { color:#FF8FAB !important; }
  body.theme-bloom .toast.warn b { color:#C81040 !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="head"><div class="title" id="title">Tasks</div><div class="count" id="count">0/0</div></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="viewport" id="viewport"><div class="scroller" id="scroller"><div class="list" id="list"></div></div></div>
</div>
<div class="toast" id="toast"></div>
<div class="status off" id="status"></div>
<script>
(() => {
  const key = location.pathname.split("/").pop();
  const params = new URLSearchParams(location.search);
  if (params.has("preview")) document.body.classList.add("preview");
  const $ = (id) => document.getElementById(id);
  let tasks = [], settings = null, ws = null, retry = 0, toastTimer = null, queue = [];
  const TEXT = {
    en: {
      added: " added: ", done: " finished: ", undone: " reopened: ",
      typeA: "Nothing on the list yet. Type ", typeB: " to add one.", empty: "Nothing on the list yet.",
      revoked: "This overlay link was replaced. Copy the new one from your dashboard.",
      limit: (d) => `{u}, you already have ${d} open tasks. Finish one first.`,
      "list full": () => "The list is full. A mod can clear finished tasks.",
      "not allowed": (d) => `Only ${({ subscriber: "subscribers", vip: "VIPs", moderator: "mods", broadcaster: "mods" })[d] || "mods"} can add tasks right now.`,
      "mods only": () => "{u}, that one is for mods.",
      "no task": (d) => d ? `{u}, you don't have a task ${d}.` : "{u}, you don't have a task.",
    },
  };
  const tr = () => TEXT.en;

  function applySettings() {
    const s = Object.assign({}, settings);
    for (const k of ["theme", "accent", "title"]) if (params.has(k)) s[k] = params.get(k);
    for (const k of ["fontSize", "width", "maxHeight"]) if (params.has(k)) s[k] = Number(params.get(k));
    const r = document.documentElement.style;
    if (/^#?[0-9a-fA-F]{6}$/.test(s.accent)) r.setProperty("--accent", s.accent.startsWith("#") ? s.accent : "#" + s.accent);
    r.setProperty("--fs", s.fontSize + "px");
    r.setProperty("--w", s.width + "px");
    r.setProperty("--mh", s.maxHeight + "px");
    document.body.className = document.body.className.replace(/theme-\w+/g, "").trim() + " theme-" + s.theme;
    $("title").textContent = s.title;
    return s;
  }

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function render() {
    if (!settings) return;
    const s = applySettings();
    const visible = s.showDone ? tasks : tasks.filter((t) => !t.done);
    const done = tasks.filter((t) => t.done).length;
    $("count").textContent = done + "/" + tasks.length;
    $("bar").style.width = tasks.length ? (100 * done / tasks.length) + "%" : "0";
    const list = $("list");
    list.replaceChildren();
    if (!visible.length) {
      const e = el("div", "empty");
      if (s.twitchLogin && s.chatEnabled) { e.append(tr().typeA); e.append(el("code", "", s.prefix + "task")); e.append(tr().typeB); }
      else e.textContent = tr().empty;
      list.append(e);
    } else if (s.groupByUser) {
      const groups = new Map();
      for (const t of visible) { if (!groups.has(t.userId)) groups.set(t.userId, []); groups.get(t.userId).push(t); }
      for (const [uid, ts] of groups) {
        const g = el("div", "group"); g.dataset.login = ts[0].login;
        const who = el("div", "who", ts[0].displayName); who.style.color = ts[0].color; g.append(who);
        for (const t of ts) g.append(taskEl(t, false));
        list.append(g);
      }
    } else {
      for (const t of visible) list.append(taskEl(t, true));
    }
    setupScroll(s);
  }

  function taskEl(t, inline) {
    const row = el("div", "task" + (t.done ? " done" : ""));
    row.append(el("span", "box"));
    const txt = el("span", "txt");
    if (inline) { const w = el("span", "inline-who", t.displayName); w.style.color = t.color; txt.append(w); }
    txt.append(document.createTextNode(t.text));
    row.append(txt);
    return row;
  }

  function setupScroll(s) {
    const sc = $("scroller"), vp = $("viewport"), list = $("list");
    sc.classList.remove("anim");
    sc.querySelectorAll(".clone").forEach((n) => n.remove());
    vp.classList.remove("fade");
    requestAnimationFrame(() => {
      const h = list.offsetHeight;
      if (s.autoScroll && h > vp.clientHeight + 4) {
        const clone = list.cloneNode(true); clone.classList.add("clone"); clone.removeAttribute("id");
        clone.querySelectorAll(".task").forEach((t) => (t.style.animation = "none"));
        sc.append(clone);
        sc.style.setProperty("--h", h + "px");
        sc.style.setProperty("--dur", Math.max(4, h / s.scrollSpeed) + "s");
        vp.classList.add("fade");
        sc.classList.add("anim");
      }
    });
  }

  function toast(ev) {
    queue.push(ev);
    if (!toastTimer) nextToast();
  }
  function nextToast() {
    const ev = queue.shift();
    const t = $("toast");
    if (!ev) { toastTimer = null; return; }
    t.replaceChildren();
    t.classList.toggle("warn", ev.kind === "rejected");
    if (ev.kind === "rejected") {
      const fn = tr()[ev.reason];
      (fn ? fn(ev.detail) : ev.reason).split("{u}").forEach((part, i) => { if (i) t.append(el("b", "", ev.user)); t.append(document.createTextNode(part)); });
    } else {
      const who = el("b", "", ev.user); who.style.color = ev.color;
      t.append(who);
      t.append(document.createTextNode(tr()[ev.kind] || " "));
      t.append(document.createTextNode(ev.text));
    }
    t.classList.add("show");
    toastTimer = setTimeout(() => { t.classList.remove("show"); toastTimer = setTimeout(nextToast, 500); }, 3200);
  }

  let revoked = false;
  function revoke() { revoked = true; tasks = []; $("list").replaceChildren(el("div", "empty", tr().revoked)); $("count").textContent = ""; }
  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(proto + "//" + location.host + "/ws/" + key + (params.has("preview") ? "?preview=1" : ""));
    ws.onopen = () => { retry = 0; $("status").classList.remove("off"); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.t === "revoked") return revoke();
      if (m.t === "state") { tasks = m.tasks; settings = m.settings; render(); }
      else if (m.t === "tasks") { tasks = m.tasks; render(); }
      else if (m.t === "settings") { settings = m.settings; render(); }
      else if (m.t === "event") {
        if (m.kind === "highlight") {
          document.querySelectorAll(".group").forEach((g) => { if (g.dataset.login && g.querySelector(".who").textContent === m.user) { g.classList.add("flash"); setTimeout(() => g.classList.remove("flash"), 1800); } });
        } else if (m.kind !== "undone" && params.get("toasts") !== "0") toast(m);
      }
      else if (m.t === "rejected" && params.get("toasts") !== "0") toast(Object.assign({ kind: "rejected" }, m));
    };
    ws.onclose = (e) => {
      $("status").classList.add("off");
      if (revoked || e.code === 4001 || e.code === 4002) return revoke();
      setTimeout(connect, Math.min(30000, 1000 * 2 ** retry++));
    };
  }
  setInterval(() => { if (ws && ws.readyState === 1) ws.send('{"op":"ping"}'); }, 30000);
  connect();
})();
</script>
</body>
</html>
